      - SESSION_HOST_PORT=
      - SESSION_PUBLIC_HOST=
      - SESSION_AUTH_TOKEN=
    volumes:
      - :/signer:ro
      - :/session-keys/enclave.seed:ro
      - worker-data:/data

volumes:
  worker-data:
